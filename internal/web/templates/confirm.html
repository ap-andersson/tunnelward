{{define "content"}}{{with .Data}}
<form method="post" action="{{.Action}}" class="panel narrow">
  <header><h1>{{$.Title}}</h1></header>
  <div class="body"><p>{{.Question}}</p></div>
  <footer>
    <button{{if .Danger}} class="danger"{{end}}>{{.Button}}</button>
    <a href="{{.Cancel}}">Cancel</a>
  </footer>
</form>
{{end}}{{end}}
