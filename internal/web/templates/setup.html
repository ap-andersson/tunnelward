{{define "content"}}
<form method="post" action="/setup" class="panel narrow">
  <header><h1>Welcome to Tunnelward</h1></header>
  <div class="body">
    <p>Choose the admin password. Until you do, anyone who can open this page could set it.</p>
    <label>Password
      <input type="password" name="password" autocomplete="new-password" minlength="8" required autofocus>
      <small class="hint">At least 8 characters.</small>
    </label>
    <label>Repeat password
      <input type="password" name="confirm" autocomplete="new-password" minlength="8" required>
    </label>
  </div>
  <footer><button>Set password</button></footer>
</form>
{{end}}
