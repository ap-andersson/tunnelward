{{define "content"}}
<article>
  <h1>Welcome to Tunnelward</h1>
  <p>Choose the admin password. Until you do, anyone who can open this page could set it, so do it right away.</p>
  <form method="post" action="/setup">
    <label>Password
      <input type="password" name="password" autocomplete="new-password" minlength="8" required autofocus>
      <small>At least 8 characters.</small>
    </label>
    <label>Repeat password
      <input type="password" name="confirm" autocomplete="new-password" minlength="8" required>
    </label>
    <button>Set password</button>
  </form>
</article>
{{end}}
